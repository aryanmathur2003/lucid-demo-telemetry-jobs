# GitLab equivalent of .github/workflows/ci.yml, kept in step with it.
stages:
  - test

rust:
  stage: test
  image: rust:1.82
  script:
    - cd rust
    - cargo test --workspace

scala:
  stage: test
  image: eclipse-temurin:17-jdk
  before_script:
    - curl -fsSL https://github.com/sbt/sbt/releases/download/v1.9.7/sbt-1.9.7.tgz | tar xz -C /opt
    - export PATH="/opt/sbt/bin:$PATH"
  script:
    - cd scala
    - sbt test
